name: generate snake animation

on:
  # regenerate daily so the grid stays current
  schedule:
    - cron: "0 */24 * * *"

  # allows running the job by hand from the Actions tab
  workflow_dispatch:

  # regenerate on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # publishes dist/ to the output branch; the svg is then served from
      # raw.githubusercontent.com/Radhdyt/Radhdyt/output/<file>
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
